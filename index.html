<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#2a2947" />
<meta name="description" content="微光原：一片黄昏里的云上草原。走路、飞行、点亮烛火，没有终点，也没有失败。" />
<title>微光原 · 云海黄昏</title>
<style>
  :root{
    --cream:#fff6e9;
    --cream-soft:rgba(255,246,233,.70);
    --cream-faint:rgba(255,246,233,.42);
    --line:rgba(255,243,226,.24);
    --glow:#ffd19b;
    --sans:"Avenir Next","Optima","PingFang SC","Hiragino Sans GB","Helvetica Neue",sans-serif;
    --serif:"Songti SC","STSong","Noto Serif SC","Source Han Serif SC",Georgia,serif;
  }
  *{box-sizing:border-box}
  html,body{width:100%;height:100%}
  body{
    margin:0;overflow:hidden;background:#262841;color:var(--cream);
    font-family:var(--sans);-webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
  }
  button{font:inherit;color:inherit}
  body{-webkit-user-select:none;user-select:none}
  #app{position:fixed;inset:0;overflow:hidden;background:
    radial-gradient(120% 80% at 50% 8%, #3c4268 0%, #8b758e 46%, #e6b39a 100%);}
  #world{
    position:absolute;inset:0;display:block;width:100%;height:100%;
    touch-action:none;cursor:grab;outline:none;
  }
  #world.dragging{cursor:grabbing}

  .grade{
    position:absolute;inset:0;pointer-events:none;z-index:1;
    background:
      linear-gradient(to top, rgba(32,25,48,.13) 0%, rgba(32,25,48,0) 30%),
      linear-gradient(to bottom, rgba(24,27,50,.30) 0%, rgba(24,27,50,.06) 20%, rgba(24,27,50,0) 34%);
  }
  .vignette{
    position:absolute;inset:0;pointer-events:none;z-index:2;
    background:radial-gradient(ellipse at 50% 47%, rgba(17,13,30,0) 46%, rgba(17,13,30,.08) 74%, rgba(17,13,30,.24) 100%);
  }
  #cloud-veil{
    position:absolute;inset:-12%;pointer-events:none;z-index:3;opacity:0;
    background:
      radial-gradient(ellipse at 48% 44%, rgba(255,250,243,.96) 0%, rgba(255,246,238,.66) 37%, rgba(250,238,232,.18) 66%, rgba(250,238,232,0) 82%),
      radial-gradient(ellipse at 78% 65%, rgba(255,250,244,.52) 0%, rgba(255,248,241,0) 55%);
    transition:opacity .18s linear;
  }
  .grain{
    position:absolute;inset:-40px;pointer-events:none;z-index:4;opacity:.045;mix-blend-mode:soft-light;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.7'/></svg>");
    background-size:180px 180px;
    animation:grainShift 1.4s steps(2,end) infinite;
  }
  @keyframes grainShift{
    0%{transform:translate3d(0,0,0)}
    50%{transform:translate3d(-11px,7px,0)}
    100%{transform:translate3d(7px,-9px,0)}
  }

  .hud{position:absolute;inset:0;z-index:6;pointer-events:none}

  .title-block{
    position:absolute;left:clamp(22px,4.7vw,68px);top:clamp(24px,5.4vh,54px);
    opacity:0;transform:translateY(14px);color:var(--cream);
  }
  body.is-ready .title-block{animation:introTitle 2.6s cubic-bezier(.19,.72,.25,1) .25s forwards}
  .eyebrow{
    display:flex;align-items:center;gap:13px;margin:0 0 17px;
    font-size:9px;line-height:1.4;letter-spacing:.35em;text-transform:uppercase;
    color:rgba(255,247,234,.82);text-shadow:0 1px 14px rgba(42,28,48,.62);
  }
  .eyebrow:before{content:"";width:38px;height:1px;background:linear-gradient(90deg,transparent,rgba(255,240,214,.75))}
  .title-block h1{
    margin:0;font-family:var(--serif);font-size:clamp(42px,5.9vw,78px);
    font-weight:400;line-height:1.06;letter-spacing:.14em;
    text-indent:.08em;text-shadow:0 3px 34px rgba(51,32,53,.32);
  }
  .title-sub{
    display:flex;align-items:center;gap:11px;margin:15px 0 0;
    font-family:var(--serif);font-size:12px;letter-spacing:.24em;
    color:rgba(255,244,226,.78);text-shadow:0 1px 16px rgba(44,30,52,.58);
  }
  .title-sub .dash{width:17px;height:1px;background:rgba(255,240,214,.4)}
  .title-sub .en{font-family:var(--sans);font-size:8px;letter-spacing:.31em;opacity:.72}

  .phase{
    position:absolute;right:clamp(22px,4.2vw,60px);top:clamp(27px,5.5vh,56px);
    display:flex;align-items:center;gap:11px;opacity:0;
    font-size:9px;letter-spacing:.27em;text-transform:uppercase;
    color:rgba(255,245,230,.8);text-shadow:0 1px 14px rgba(40,28,48,.6);
  }
  body.is-ready .phase{animation:softIn 2.2s ease 1.3s forwards}
  .phase-dot{
    width:6px;height:6px;flex:0 0 6px;border-radius:50%;
    background:var(--glow);box-shadow:0 0 13px 2px rgba(255,206,150,.63);
    animation:breath 4.8s ease-in-out infinite;
  }
  .phase-sep{width:22px;height:1px;background:rgba(255,244,228,.24)}

  .hint{
    position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + clamp(20px,3.7vh,38px));
    transform:translateX(-50%) translateY(8px);opacity:0;white-space:nowrap;
    display:flex;align-items:center;gap:clamp(13px,2.2vw,30px);
  }
  body.is-ready .hint{animation:hintIn 2s cubic-bezier(.2,.7,.3,1) 2.1s forwards}
  .hint-group{display:flex;align-items:center;gap:9px;color:rgba(255,248,238,.78);font-size:10px;letter-spacing:.18em;text-shadow:0 1px 10px rgba(31,23,37,.55)}
  .keycap{
    display:inline-flex;align-items:center;justify-content:center;
    min-width:25px;height:23px;padding:0 7px;border-radius:5px;
    border:1px solid rgba(255,244,227,.26);
    background:rgba(255,248,237,.07);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 3px 14px rgba(32,24,45,.12);
    color:rgba(255,248,239,.82);font-size:9px;line-height:1;
    letter-spacing:.1em;backdrop-filter:blur(5px);-webkit-backdrop-filter:blur(5px);
  }
  .keycap.wide{min-width:54px}
  .hint-dot{width:3px;height:3px;border-radius:50%;background:rgba(255,244,228,.42);box-shadow:0 0 8px rgba(38,28,44,.35)}

  .whisper{
    position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + clamp(65px,10vh,94px));
    transform:translateX(-50%);opacity:0;white-space:nowrap;
    font-family:var(--serif);font-size:13px;letter-spacing:.24em;
    color:rgba(255,247,232,.67);text-shadow:0 2px 20px rgba(35,25,49,.55);
    transition:opacity 1.6s ease;
  }
  .whisper.show{opacity:.92}
  .flight-tip{
    position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + clamp(58px,8.5vh,78px));
    transform:translateX(-50%);opacity:0;white-space:nowrap;pointer-events:none;
    font-size:9px;letter-spacing:.22em;color:rgba(255,248,237,.62);
    text-shadow:0 1px 12px rgba(33,24,43,.6);
    transition:opacity .6s ease;
  }
  body.is-flying .flight-tip{opacity:1}
  .note{
    position:absolute;right:clamp(22px,4.2vw,60px);
    bottom:calc(env(safe-area-inset-bottom,0px) + clamp(20px,3.7vh,38px));
    opacity:0;font-size:8px;letter-spacing:.24em;color:rgba(255,244,230,.35);
    text-transform:uppercase;
  }
  body.is-ready .note{animation:softIn 2s ease 3s forwards}

  #loading{
    position:fixed;inset:0;z-index:20;display:grid;place-items:center;
    background:
      radial-gradient(75% 55% at 63% 73%, rgba(255,202,150,.72) 0%, rgba(240,164,143,.42) 28%, rgba(141,112,136,0) 62%),
      linear-gradient(180deg,#303a61 0%,#7e6b8b 50%,#e8b598 100%);
    transition:opacity 1.8s ease, visibility 1.8s ease;
  }
  #loading.done{opacity:0;visibility:hidden}
  .loader-inner{text-align:center;transform:translateY(-8px)}
  .loader-mark{
    width:7px;height:7px;margin:0 auto 25px;border-radius:50%;
    background:#fff2d9;box-shadow:0 0 22px 7px rgba(255,212,158,.55);
    animation:breath 2.6s ease-in-out infinite;
  }
  .loader-title{
    margin:0;font-family:var(--serif);font-size:31px;font-weight:400;
    letter-spacing:.3em;text-indent:.3em;color:rgba(255,247,233,.95);
    text-shadow:0 2px 28px rgba(52,35,54,.32);
  }
  .loader-sub{
    margin:15px 0 0;font-size:8px;letter-spacing:.38em;text-transform:uppercase;
    color:rgba(255,246,231,.58);
  }
  .loader-track{width:112px;height:1px;margin:26px auto 0;background:rgba(255,244,227,.15);overflow:hidden}
  .loader-track span{
    display:block;width:42%;height:100%;
    background:linear-gradient(90deg,transparent,rgba(255,240,212,.86),transparent);
    animation:loaderSweep 2.4s ease-in-out infinite;
  }

  #fatal{
    position:fixed;inset:0;z-index:30;display:none;place-items:center;padding:32px;
    background:linear-gradient(180deg,#202843,#5e536b 62%,#a87f80);
  }
  #fatal.show{display:grid}
  .fatal-card{max-width:430px;text-align:center}
  .fatal-card h2{margin:0 0 14px;font-family:var(--serif);font-size:25px;font-weight:400;letter-spacing:.15em}
  .fatal-card p{margin:0;font-size:12px;line-height:2;letter-spacing:.08em;color:rgba(255,246,233,.63)}
  .fatal-card button{
    margin-top:26px;padding:10px 22px;border-radius:99px;border:1px solid rgba(255,244,228,.3);
    background:rgba(255,250,240,.08);letter-spacing:.15em;font-size:11px;cursor:pointer;
  }

  #touch-ui{display:none}
  .touch-copy{display:none}

  @keyframes introTitle{to{opacity:1;transform:translateY(0)}}
  @keyframes softIn{to{opacity:1}}
  @keyframes hintIn{to{opacity:1;transform:translateX(-50%) translateY(0)}}
  @keyframes breath{0%,100%{opacity:.65;transform:scale(.9)}50%{opacity:1;transform:scale(1.1)}}
  @keyframes loaderSweep{0%{transform:translateX(-110%)}55%,100%{transform:translateX(280%)}}

  @media (max-width:760px){
    .title-block{top:calc(env(safe-area-inset-top,0px) + 22px)}
    .title-block h1{font-size:42px;letter-spacing:.12em}
    .eyebrow{font-size:7px;margin-bottom:12px;letter-spacing:.26em}
    .title-sub{font-size:10px;letter-spacing:.18em;margin-top:10px}
    .title-sub .en{display:none}
    .phase{top:calc(env(safe-area-inset-top,0px) + 26px);font-size:8px;letter-spacing:.18em}
    .phase-sep{width:10px}
    .note{display:none}
    .whisper{font-size:11px;letter-spacing:.16em;bottom:calc(env(safe-area-inset-bottom,0px) + 155px)}
    .flight-tip{display:none}
  }

  @media (pointer:coarse){
    .hint{display:none}
    .touch-copy{
      display:block;position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 128px);
      transform:translateX(-50%);opacity:0;white-space:nowrap;font-size:9px;letter-spacing:.15em;color:rgba(255,246,233,.4);
    }
    body.is-ready .touch-copy{animation:softIn 2s ease 2.5s forwards}
    #touch-ui{
      display:flex;align-items:flex-end;justify-content:space-between;
      position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 27px);
      padding:0 28px;z-index:8;pointer-events:none;opacity:0;
    }
    body.is-ready #touch-ui{animation:softIn 1.8s ease 1.5s forwards}
    .stick{
      pointer-events:auto;position:relative;width:104px;height:104px;border-radius:50%;
      border:1px solid rgba(255,244,228,.23);background:radial-gradient(circle,rgba(255,248,236,.055),rgba(255,248,236,.015));
      box-shadow:0 0 30px rgba(255,231,200,.05);touch-action:none;
    }
    .stick:after{
      content:"";position:absolute;inset:25px;border-radius:50%;border:1px solid rgba(255,244,228,.08);
    }
    .stick-knob{
      position:absolute;left:50%;top:50%;width:38px;height:38px;margin:-19px 0 0 -19px;border-radius:50%;
      background:radial-gradient(circle at 38% 32%,rgba(255,250,240,.82),rgba(255,225,188,.36));
      box-shadow:0 0 20px rgba(255,219,177,.2);transition:transform .06s linear;
    }
    .rise{
      pointer-events:auto;width:76px;height:76px;border-radius:50%;touch-action:none;
      border:1px solid rgba(255,244,228,.28);background:radial-gradient(circle at 40% 32%,rgba(255,249,237,.15),rgba(255,239,216,.035));
      color:rgba(255,247,234,.8);font-family:var(--serif);font-size:15px;letter-spacing:.14em;
      box-shadow:0 0 32px rgba(255,225,188,.09);backdrop-filter:blur(4px);
    }
    .rise:active{background:radial-gradient(circle at 40% 32%,rgba(255,249,237,.3),rgba(255,239,216,.08))}
    .touch-copy{display:block}
    .whisper{bottom:calc(env(safe-area-inset-bottom,0px) + 192px)}
  }
</style>
</head>
<body>
<div id="app">
  <canvas id="world" aria-label="微光原：黄昏云海中的草原，操控白色小人漫步、飞行并点亮烛火"></canvas>
  <div class="grade" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>
  <div id="cloud-veil" aria-hidden="true"></div>
  <div class="grain" aria-hidden="true"></div>

  <div class="hud" aria-hidden="true">
    <header class="title-block">
      <p class="eyebrow">A quiet place above the clouds</p>
      <h1>微光原</h1>
      <p class="title-sub"><span class="dash"></span><span>暮色落下时，光会记得你</span><span class="en">SHIMMER MEADOW</span></p>
    </header>

    <div class="phase">
      <span class="phase-dot"></span>
      <span id="phase-text">薄暮 · 暖</span>
      <span class="phase-sep"></span>
      <span>DUSK</span>
    </div>

    <div class="hint">
      <div class="hint-group"><span class="keycap">W</span><span class="keycap">A</span><span class="keycap">S</span><span class="keycap">D</span><span>行走 · 飞行方向</span></div>
      <span class="hint-dot"></span>
      <div class="hint-group"><span class="keycap wide">SPACE</span><span>按住飞升 · 松开缓落</span></div>
      <span class="hint-dot"></span>
      <div class="hint-group"><span class="keycap wide">拖动</span><span>环顾 · 也可 Q / E</span></div>
    </div>

    <div id="whisper" class="whisper"></div>
    <div class="flight-tip">WASD / 方向键 · 调整飞行方向</div>
    <div class="note">no ending · only wind &amp; light</div>

    <div id="touch-ui">
      <div class="stick" id="stick" aria-label="行走摇杆"><div class="stick-knob" id="stick-knob"></div></div>
      <button class="rise" id="rise" type="button" aria-label="按住飞升">升</button>
    </div>
    <div class="touch-copy">左侧摇杆 · 行走 / 控向 · 右侧长按飞升 · 拖动环顾</div>
  </div>

  <div id="loading">
    <div class="loader-inner">
      <div class="loader-mark"></div>
      <p class="loader-title">微光原</p>
      <p class="loader-sub">the dusk is gathering</p>
      <div class="loader-track"><span></span></div>
    </div>
  </div>

  <div id="fatal">
    <div class="fatal-card">
      <h2>光暂时没有抵达</h2>
      <p id="fatal-detail">场景需要网络加载 Three.js，并需要浏览器开启 WebGL。<br>请确认网络后刷新页面。</p>
      <button type="button" onclick="location.reload()">再试一次</button>
    </div>
  </div>
</div>

<script type="module">
const CDN_SOURCES = [
  'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.min.js',
  'https://unpkg.com/three@0.170.0/build/three.module.min.js',
  'https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js'
];

function fatal(detail) {
  const panel = document.getElementById('fatal');
  document.getElementById('loading').classList.add('done');
  if (detail) document.getElementById('fatal-detail').innerHTML = detail;
  panel.classList.add('show');
}

async function boot() {
  let THREE = null;
  for (const url of CDN_SOURCES) {
    try {
      THREE = await import(url);
      break;
    } catch (err) {
      console.warn('[微光原] CDN 未响应：', url, err);
    }
  }
  if (!THREE) {
    fatal('场景需要联网加载 Three.js。<br>请检查网络连接后刷新页面。');
    return;
  }
  try {
    initApp(THREE);
  } catch (err) {
    console.error(err);
    fatal('当前浏览器未能启动 WebGL 场景。<br>请使用较新的 Chrome、Safari 或 Edge，并确认硬件加速已开启。');
  }
}

function initApp(THREE) {
  const TAU = Math.PI * 2;
  const Y_AXIS = new THREE.Vector3(0, 1, 0);
  const TMP = new THREE.Vector3();
  const TMP2 = new THREE.Vector3();
  const TMP3 = new THREE.Vector3();
  const TMP_CLOUD = new THREE.Color();
  const clockNow = () => performance.now() / 1000;

  const $ = (sel) => document.querySelector(sel);
  const canvas = $('#world');
  const cloudVeil = $('#cloud-veil');
  const phaseText = $('#phase-text');
  const whisperEl = $('#whisper');
  const loadingEl = $('#loading');
  const isCoarse = window.matchMedia('(pointer: coarse)').matches;
  const isNarrow = window.innerWidth < 760;
  const portraitAtStart = window.innerHeight > window.innerWidth * 1.15;

  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const lerp = (a, b, t) => a + (b - a) * t;
  const smoothstep = (a, b, v) => {
    const t = clamp((v - a) / (b - a), 0, 1);
    return t * t * (3 - 2 * t);
  };
  const damp = (a, b, lambda, dt) => lerp(a, b, 1 - Math.exp(-lambda * dt));
  const dampAngle = (a, b, lambda, dt) => {
    let diff = ((b - a + Math.PI) % TAU + TAU) % TAU - Math.PI;
    return a + diff * (1 - Math.exp(-lambda * dt));
  };
  const rand = (() => {
    let s = 20240517;
    return () => {
      s = (s * 1664525 + 1013904223) >>> 0;
      return s / 4294967296;
    };
  })();
  const range = (a, b) => a + rand() * (b - a);
  const pick = (arr) => arr[Math.floor(rand() * arr.length)];

  /* ---------------------------------------------------------------------- */
  /*  renderer                                                              */
  /* ---------------------------------------------------------------------- */
  const renderer = new THREE.WebGLRenderer({
    canvas,
    antialias: true,
    alpha: false,
    powerPreference: 'high-performance'
  });
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.NeutralToneMapping;
  renderer.toneMappingExposure = 1.15;
  renderer.shadowMap.enabled = false;
  const maxDpr = isCoarse ? 1.35 : 1.55;
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, maxDpr));
  renderer.setSize(window.innerWidth, window.innerHeight);

  const scene = new THREE.Scene();
  const FOG_BASE = 0.0052;
  scene.fog = new THREE.FogExp2(0xd9afa3, FOG_BASE);

  const camera = new THREE.PerspectiveCamera(portraitAtStart ? 64 : 56, window.innerWidth / window.innerHeight, 0.08, 1500);
  camera.position.set(0, 4, 18);

  /* ---------------------------------------------------------------------- */
  /*  soft bloom / color grade                                              */
  /* ---------------------------------------------------------------------- */
  const floatSupported = !!renderer.extensions.has('EXT_color_buffer_float') || !!renderer.extensions.has('EXT_color_buffer_half_float');
  const RT_TYPE = floatSupported ? THREE.HalfFloatType : THREE.UnsignedByteType;
  const sceneRT = new THREE.WebGLRenderTarget(2, 2, {
    type: RT_TYPE, depthBuffer: true, stencilBuffer: false,
    minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter
  });
  const brightRT = new THREE.WebGLRenderTarget(2, 2, {
    type: RT_TYPE, depthBuffer: false, stencilBuffer: false,
    minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter
  });
  const blurRT_A = new THREE.WebGLRenderTarget(2, 2, {
    type: RT_TYPE, depthBuffer: false, stencilBuffer: false,
    minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter
  });
  const blurRT_B = new THREE.WebGLRenderTarget(2, 2, {
    type: RT_TYPE, depthBuffer: false, stencilBuffer: false,
    minFilter: THREE.LinearFilter, magFilter: THREE.LinearFilter
  });

  const postScene = new THREE.Scene();
  const postCamera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
  const postQuad = new THREE.Mesh(new THREE.PlaneGeometry(2, 2));
  postQuad.frustumCulled = false;
  postScene.add(postQuad);

  const postVert = `
    varying vec2 vUv;
    void main() {
      vUv = uv;
      gl_Position = vec4(position.xy, 0.0, 1.0);
    }
  `;

  const brightMat = new THREE.ShaderMaterial({
    uniforms: {
      tDiffuse: { value: sceneRT.texture },
      threshold: { value: 0.9 },
      knee: { value: 0.22 }
    },
    vertexShader: postVert,
    fragmentShader: `
      uniform sampler2D tDiffuse;
      uniform float threshold;
      uniform float knee;
      varying vec2 vUv;
      void main() {
        vec3 c = texture2D(tDiffuse, vUv).rgb;
        float l = max(c.r, max(c.g, c.b));
        float k = smoothstep(threshold, threshold + knee, l);
        gl_FragColor = vec4(c * k, 1.0);
      }
    `,
    depthTest: false, depthWrite: false
  });

  const blurMat = new THREE.ShaderMaterial({
    uniforms: {

  function hash2(ix, iz) {
    const n = Math.sin(ix * 127.1 + iz * 311.7) * 43758.5453123;
    return n - Math.floor(n);
  }
  function noise2(x, z) {
    const ix = Math.floor(x);
    const iz = Math.floor(z);
    const fx = x - ix;
    const fz = z - iz;
    const u = fx * fx * (3 - 2 * fx);
    const v = fz * fz * (3 - 2 * fz);
    const a = hash2(ix, iz);
    const b = hash2(ix + 1, iz);
    const c = hash2(ix, iz + 1);
    const d = hash2(ix + 1, iz + 1);
    return (a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v) * 2 - 1;
  }
  function fbm(x, z, octaves) {
    let sum = 0;
    let amp = 0.5;
    let fx = x;
    let fz = z;
    let total = 0;
    for (let i = 0; i < octaves; i++) {
      sum += noise2(fx, fz) * amp;
      total += amp;
      fx = fx * 2.02 + 17.3;
      fz = fz * 2.03 - 9.1;
      amp *= 0.5;
    }
    return sum / total;
  }
  function terrainHeight(x, z) {
    const r = Math.hypot(x, z);
    let h = 2.15 * fbm(x * 0.041 + 11.3, z * 0.041 - 7.1, 4)
          + 1.2 * fbm(x * 0.104 + 3.7, z * 0.104 + 8.4, 3)
          + 0.5 * fbm(x * 0.26 - 2.2, z * 0.26 + 1.4, 2);
    h += 1.2 * smoothstep(-22, 14, z);
    h += 0.55 * Math.sin((x - z) * 0.07);
    // 出生点的小山丘，以及向日落方向铺开的低谷，让云海能被看见
    h += 2.5 * Math.exp(-((x * x) / (27 * 27) + ((z - 8) * (z - 8)) / (23 * 23)) * 1.7);
    h -= 6.8 * smoothstep(9, -38, z) * Math.exp(-(x * x) / (72 * 72));
    const drop = smoothstep(46, 94, r);
    h = h * (1 - drop * 0.62) - drop * 23.0;
    // 整片草甸高高地浮在云海之上
    h += 9.6 * (1.0 - smoothstep(38, 92, r));
    return h;
  }
  function terrainNormal(x, z, out) {
    const e = 0.7;
    const hx = terrainHeight(x + e, z) - terrainHeight(x - e, z);
    const hz = terrainHeight(x, z + e) - terrainHeight(x, z - e);
    return (out || new THREE.Vector3()).set(-hx / (2 * e), 1, -hz / (2 * e)).normalize();
  }

  const TERRAIN_RADIUS = isCoarse ? 98 : 106;
  const terrainRings = isCoarse ? 96 : 150;
  const terrainSegments = isCoarse ? 160 : 250;
  const terrainGeo = (() => {
    const positions = [];
    const uvs = [];
    const indices = [];
    // 中心点
    positions.push(0, terrainHeight(0, 0), 0);
    uvs.push(0, 0);
    // 从内到外的圆环
    for (let i = 1; i <= terrainRings; i++) {
      const rr = TERRAIN_RADIUS * Math.pow(i / terrainRings, 1.04);
      for (let j = 0; j < terrainSegments; j++) {
        const a = (j / terrainSegments) * TAU;
        const x = Math.cos(a) * rr;
        const z = Math.sin(a) * rr;
        positions.push(x, terrainHeight(x, z), z);
        uvs.push(x / 8, z / 8);
      }
    }
    // 中心扇面
    for (let j = 0; j < terrainSegments; j++) {
      const n = j === terrainSegments - 1 ? 0 : j + 1;
      indices.push(0, 1 + n, 1 + j);
    }
    // 圆环之间的四边形
    for (let i = 0; i < terrainRings - 1; i++) {
      const rowA = 1 + i * terrainSegments;
      const rowB = rowA + terrainSegments;
      for (let j = 0; j < terrainSegments; j++) {
        const n = (j + 1) % terrainSegments;
        const a = rowA + j;
        const b = rowA + n;
        const c = rowB + j;
        const d = rowB + n;
        indices.push(a, b, c, b, d, c);
      }
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
    geo.setIndex(indices);
    geo.computeVertexNormals();

    const pos = geo.attributes.position;
    const colors = new Float32Array(pos.count * 3);
    const cDark = new THREE.Color('#5b7056');
    const cMeadow = new THREE.Color('#849a6e');
    const cLight = new THREE.Color('#aba779');
    const cDry = new THREE.Color('#c3b181');
    const cFar = new THREE.Color('#807787');
    const tmpC = new THREE.Color();
    const nrm = new THREE.Vector3();
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i);
      const z = pos.getZ(i);
      const h = pos.getY(i);
      const r = Math.hypot(x, z);
      terrainNormal(x, z, nrm);
      const up = nrm.y;
      const patch = fbm(x * 0.12 + 4.1, z * 0.12 - 3.2, 3);
      const fine = fbm(x * 0.55 - 2.3, z * 0.55 + 4.1, 2);
      let t = clamp(0.5 + patch * 0.65 + fine * 0.18 + h * 0.012, 0, 1);
      tmpC.copy(cDark).lerp(cMeadow, clamp(t + 0.03, 0, 1));
      tmpC.lerp(cLight, clamp(0.18 + patch * 0.3 + (1 - up) * 0.3, 0, .7));
      tmpC.lerp(cDry, clamp((fine * 0.5 + 0.5) * 0.2 + smoothstep(3.0, 8.0, h) * 0.12, 0, .36));
      const far = smoothstep(45, 100, r);
      tmpC.lerp(cFar, far * 0.82);
      const shade = clamp((1 - up) * 1.5, 0, .6);
      tmpC.multiplyScalar(1 - shade * 0.16);
      colors[i * 3] = tmpC.r;
      colors[i * 3 + 1] = tmpC.g;
      colors[i * 3 + 2] = tmpC.b;
    }
    geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
    return geo;
  })();

  const meadowTexture = (() => {
    let local = 7331;
    const rr = () => {
      local = (local * 1664525 + 1013904223) >>> 0;
      return local / 4294967296;
    };
    const c = document.createElement('canvas');
    c.width = c.height = 512;
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#ecebd8';
    ctx.fillRect(0, 0, 512, 512);
    for (let i = 0; i < 46; i++) {
      const x = rr() * 512;
      const y = rr() * 512;
      const r = 28 + rr() * 94;
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      const dark = rr() > .45;
      g.addColorStop(0, dark ? 'rgba(132,142,108,.16)' : 'rgba(255,252,224,.18)');
      g.addColorStop(1, dark ? 'rgba(132,142,108,0)' : 'rgba(255,252,224,0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(x, y, r, 0, TAU);
      ctx.fill();
    }
    for (let i = 0; i < 6200; i++) {
      const x = rr() * 512;
      const y = rr() * 512;
      const len = 1 + rr() * 5;
      const a = -Math.PI / 2 + (rr() - .5) * 1.3;
      ctx.strokeStyle = rr() > .62 ? 'rgba(255,252,224,.22)' : 'rgba(92,108,76,.16)';
      ctx.lineWidth = .6 + rr() * .8;
      ctx.beginPath();
      ctx.moveTo(x, y);
      ctx.lineTo(x + Math.cos(a) * len, y + Math.sin(a) * len);
      ctx.stroke();
    }
    for (let i = 0; i < 320; i++) {
      const x = rr() * 512;
      const y = rr() * 512;
      ctx.fillStyle = rr() > .5 ? 'rgba(255,246,205,.5)' : 'rgba(214,190,148,.4)';
      ctx.beginPath();
      ctx.arc(x, y, .5 + rr() * 1.2, 0, TAU);
      ctx.fill();
    }
    const tex = new THREE.CanvasTexture(c);

    tex.repeat.set(1, 1);

    tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
    return tex;
  })();

  function makeBladeGeometry() {
    const pos = [];
    const idx = [];
    const nor = [];
    const uv = [];
    const levels = 2;
    for (let i = 0; i <= levels; i++) {
      const t = i / levels;
      const w = 0.030 * (1 - t * 0.9) + 0.003;
      const z = Math.sin(t * Math.PI) * 0.035;
      const y = t;
      pos.push(-w * .5, y, z);
      pos.push(w * .5, y, z);
      uv.push(0, t, 1, t);
      for (let k = 0; k < 2; k++) nor.push(0, 0.48, 0.88);
    }
    for (let i = 0; i < levels; i++) {
      const a = i * 2;
      idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    geo.setAttribute('normal', new THREE.Float32BufferAttribute(nor, 3));
    geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
    geo.setIndex(idx);
    return geo;
  }

  function makeTuftGeometry() {
    const pieces = [];
    const arrangements = [
      { ry: 0.0, x: 0.0, z: 0.0, h: 1.0 },
      { ry: 2.1, x: 0.08, z: 0.035, h: 0.85 },
      { ry: 4.3, x: -0.07, z: -0.025, h: 0.72 },
      { ry: 0.9, x: -0.1, z: 0.045, h: 0.94 },
      { ry: 3.3, x: 0.11, z: -0.05, h: 0.62 }
    ];
    const geos = [];
    for (const a of arrangements) {
      const g = makeBladeGeometry();
      g.rotateY(a.ry);
      g.translate(a.x, 0, a.z);
      g.scale(1, a.h, 1);
      geos.push(g);
    }
    // merge manually
    let totalVerts = 0;
    let totalIndices = 0;
    for (const g of geos) {
      totalVerts += g.attributes.position.count;
      totalIndices += g.index.count;
    }
    const positions = new Float32Array(totalVerts * 3);
    const normals = new Float32Array(totalVerts * 3);
    const uvs = new Float32Array(totalVerts * 2);
    const indices = new Uint16Array(totalIndices);
    let vo = 0;
    let io = 0;
    for (const g of geos) {
      positions.set(g.attributes.position.array, vo * 3);
      normals.set(g.attributes.normal.array, vo * 3);
      uvs.set(g.attributes.uv.array, vo * 2);
      const arr = g.index.array;
      for (let j = 0; j < arr.length; j++) indices[io + j] = arr[j] + vo;
      vo += g.attributes.position.count;
      io += arr.length;
    }
    const result = new THREE.BufferGeometry();
    result.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    result.setAttribute('normal', new THREE.BufferAttribute(normals, 3));
    result.setAttribute('uv', new THREE.BufferAttribute(uvs, 2));
    result.setIndex(new THREE.BufferAttribute(indices, 1));
    pieces.push(result);
    return result;
  }

  /* ---------------------------------------------------------------------- */

  const cloudTintMats = [];

  function makeCloudBillboardTexture(seed) {
    let local = seed >>> 0;
    const rr = () => {
      local = (local * 1664525 + 1013904223) >>> 0;
      return local / 4294967296;
    };
    const W = 1024;
    const H = 512;
    const c = document.createElement('canvas');
    c.width = W;
    c.height = H;
    const ctx = c.getContext('2d');
    ctx.clearRect(0, 0, W, H);
    const lobes = [];
    // 底部一排云团
    for (let i = 0; i < 9; i++) {
      lobes.push({
        x: W * (.20 + i * .075) + (rr() - .5) * W * .035,
        y: H * (.69 + (rr() - .5) * .035),
        r: W * (.055 + rr() * .035)
      });
    }
    // 中间和顶部隆起的云团
    for (let i = 0; i < 8; i++) {
      const f = i / 7;
      lobes.push({
        x: W * (.28 + f * .44) + (rr() - .5) * W * .045,
        y: H * (.56 - Math.sin(f * Math.PI) * .11 + (rr() - .5) * .05),
        r: W * (.055 + rr() * .055)
      });
    }
    // 主峰与几个小圆顶
    lobes.push({ x: W * .48, y: H * .43, r: W * .115 });
    lobes.push({ x: W * .61, y: H * .47, r: W * .085 });
    lobes.push({ x: W * .37, y: H * .5, r: W * .075 });
    for (let i = 0; i < 6; i++) {
      lobes.push({
        x: W * (.3 + rr() * .42),
        y: H * (.38 + rr() * .17),
        r: W * (.03 + rr() * .04)
      });
    }
    // 让所有小云团融合成一朵
    ctx.save();
    ctx.filter = 'blur(7px)';
    ctx.fillStyle = '#ffffff';
    for (const b of lobes) {
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, TAU);
      ctx.fill();
    }
    // 再补一层，让中心更厚
    ctx.filter = 'blur(14px)';
    ctx.globalAlpha = .5;
    ctx.fillStyle = '#ffffff';
    for (let i = 0; i < lobes.length; i += 3) {
      const b = lobes[i];
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r * 1.08, 0, TAU);
      ctx.fill();
    }
    ctx.restore();

    // 给云体积：上面被夕阳照亮，下面偏冷
    ctx.globalCompositeOperation = 'source-atop';
    const shade = ctx.createLinearGradient(0, H * .25, 0, H * .9);
    shade.addColorStop(0, 'rgba(255,250,242,.18)');
    shade.addColorStop(.48, 'rgba(255,248,242,0)');
    shade.addColorStop(.78, 'rgba(210,175,186,.11)');
    shade.addColorStop(1, 'rgba(158,132,156,.25)');
    ctx.fillStyle = shade;
    ctx.fillRect(0, 0, W, H);

    const topGlow = ctx.createRadialGradient(W * .42, H * .38, 0, W * .42, H * .38, W * .42);
    topGlow.addColorStop(0, 'rgba(255,252,244,.28)');
    topGlow.addColorStop(.6, 'rgba(255,250,240,.06)');
    topGlow.addColorStop(1, 'rgba(255,250,240,0)');
    ctx.fillStyle = topGlow;
    ctx.fillRect(0, 0, W, H);
    ctx.globalCompositeOperation = 'source-over';

    const tex = new THREE.CanvasTexture(c);
    tex.colorSpace = THREE.SRGBColorSpace;
    tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
    return tex;
  }

  const cloudBillboardTextures = [
    makeCloudBillboardTexture(17),
    makeCloudBillboardTexture(93),
    makeCloudBillboardTexture(251)
  ];

  function cloudBillboard(x, y, z, width, opacity, textureIndex, rotation, shade) {
    const mat = new THREE.SpriteMaterial({
      map: cloudBillboardTextures[textureIndex % cloudBillboardTextures.length],
      color: env.cloud,
      transparent: true,
      opacity,
      depthWrite: false,
      depthTest: true,
      blending: THREE.NormalBlending,
      toneMapped: true,
      rotation: rotation || 0
    });
    mat.userData.shade = shade == null ? 0.1 : shade;
    const cloudAngle = Math.atan2(z, x);
    let sunDist = Math.abs(((cloudAngle - SUN_ANGLE + Math.PI) % TAU + TAU) % TAU - Math.PI);
    mat.userData.warmth = clamp(1 - sunDist / 1.45, 0, 1) * .8 + rand() * .12;
    mat.userData.baseOpacity = opacity;
    mat.userData.cool = clamp((Math.hypot(x, z) - 80) / 220, 0, 1) * .5;
    const sprite = new THREE.Sprite(mat);
    sprite.position.set(x, y, z);
    const h = width * 0.42 * range(0.88, 1.1);
    sprite.scale.set(width, h, 1);
    cloudTintMats.push(mat);
    return sprite;
  }

  /* ---------------------------------------------------------------------- */
  /*  candle shrines                                                         */
  /* ---------------------------------------------------------------------- */
  const candlePositions = CANDLE_SPOTS;
  const candleWax = new THREE.MeshStandardMaterial({
    color: 0xeee0c8, roughness: 0.88, metalness: 0.0,

  });
  const candleStone = new THREE.MeshStandardMaterial({
    color: 0x5e5967, roughness: 1.0, metalness: 0.0,

  });
  const candleWickMat = new THREE.MeshBasicMaterial({ color: 0x2a1b17 });
  const flameOuterMat = new THREE.MeshBasicMaterial({
    color: 0xff8a32, transparent: true, opacity: 0.84,
    depthWrite: false, blending: THREE.AdditiveBlending, toneMapped: true
  });
  const flameInnerMat = new THREE.MeshBasicMaterial({
    color: 0xffe6a6, transparent: true, opacity: 0.98,
    depthWrite: false, blending: THREE.AdditiveBlending, toneMapped: true
  });
  const flameOuterGeo = new THREE.SphereGeometry(1, 8, 8);
  const flameInnerGeo = new THREE.SphereGeometry(1, 7, 7);

  const candles = [];
  function buildCandle(x, z, index) {
    const root = new THREE.Group();
    const groundY = terrainHeight(x, z);
    root.position.set(x, groundY - 0.02, z);
    root.rotation.y = rand() * TAU;
    const n = terrainNormal(x, z);
    const tilt = new THREE.Quaternion().setFromUnitVectors(Y_AXIS, n);
    root.quaternion.copy(tilt);

    // 石台
    const base = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.42, 0.3, 9, 1, false), candleStone);
    base.position.y = 0.15;
    base.scale.set(1.2, 1, 0.9);
    root.add(base);
    for (let i = 0; i < 4; i++) {
      const a = (i / 4) * TAU + rand();
      const rr = range(0.22, 0.42);
      const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(range(0.06, 0.14), 0), candleStone);
      rock.position.set(Math.cos(a) * rr, range(0.005, 0.04), Math.sin(a) * rr);
      rock.rotation.set(rand() * 3, rand() * 3, rand() * 3);
      root.add(rock);
    }

    const tapers = [
      { x: -0.15, z: 0.03, h: 0.52, r: 0.037, phase: 0.3 },
      { x: 0.04, z: 0.06, h: 0.78, r: 0.043, phase: 1.8 },
      { x: 0.18, z: -0.05, h: 0.42, r: 0.032, phase: 3.4 }
    ];
    const flames = [];
    for (const taper of tapers) {
      const candle = new THREE.Mesh(new THREE.CylinderGeometry(taper.r * 0.76, taper.r, taper.h, 9), candleWax);
      candle.position.set(taper.x, taper.h / 2 + 0.31, taper.z);
      root.add(candle);
      const wick = new THREE.Mesh(new THREE.CylinderGeometry(0.004, 0.004, 0.07, 4), candleWickMat);
      wick.position.set(taper.x, taper.h + 0.335, taper.z);
      root.add(wick);

      const flame = new THREE.Group();
      flame.position.set(taper.x, taper.h + 0.395, taper.z);
      const outer = new THREE.Mesh(flameOuterGeo, flameOuterMat);
      outer.scale.set(0.048, 0.125, 0.048);
      const inner = new THREE.Mesh(flameInnerGeo, flameInnerMat);
      inner.scale.set(0.026, 0.074, 0.026);
      inner.position.y = 0.017;
      flame.add(outer, inner);
      flame.scale.setScalar(0.001);
      root.add(flame);
      flames.push({ group: flame, phase: taper.phase, baseY: taper.h + 0.395 });
    }

    const halo = new THREE.Sprite(new THREE.SpriteMaterial({
      map: texGlow, color: 0xffb968, transparent: true, opacity: 0,
      depthWrite: false, depthTest: true, blending: THREE.AdditiveBlending, toneMapped: true
    }));
    halo.position.set(0.04, 1.26, 0.06);
    halo.scale.set(1.35, 1.35, 1);
    root.add(halo);

    const groundGlow = new THREE.Mesh(
      new THREE.PlaneGeometry(1, 1),
      new THREE.MeshBasicMaterial({
        map: texGlow, color: 0xffa85d, transparent: true, opacity: 0,
        depthWrite: false, blending: THREE.AdditiveBlending, toneMapped: true
      })
    );
    groundGlow.rotation.x = -Math.PI / 2;
    groundGlow.position.y = 0.045;
    groundGlow.scale.setScalar(4.2);
    groundGlow.renderOrder = 2;
    root.add(groundGlow);

    const light = new THREE.PointLight(0xffa95a, 0, 9.5, 2.1);
    light.position.set(0.04, 1.28, 0.06);
    root.add(light);

    // 未点亮时的一点微光，让人能循着光走
    const guide = new THREE.Sprite(new THREE.SpriteMaterial({
      map: texSpark, color: 0xffd59a, transparent: true, opacity: 0.14,
      depthWrite: false, depthTest: false, blending: THREE.AdditiveBlending, toneMapped: true
    }));
    guide.position.set(0.04, 1.72, 0.06);
    guide.scale.setScalar(0.16);
    guide.renderOrder = 6;
    root.add(guide);

    const anchor = new THREE.Object3D();
    anchor.position.set(0.04, 1.31, 0.06);
    root.add(anchor);

    scene.add(root);
    const candle = {
      root, index, lit: false, glow: 0, targetGlow: 0,
      flames, halo, groundGlow, light, anchor, guide, flare: rand() * TAU
    };
    candles.push(candle);
    return candle;
  }
  candlePositions.forEach(([x, z], i) => buildCandle(x, z, i));

  function makeChildMaterials(accentHex, glowHex, isPlayer) {
    const accent = new THREE.Color(accentHex);

        emissive: glow, emissiveIntensity: 0.18, side: THREE.DoubleSide, vertexColors: true
      }),
      glow,
      accentColor: accent
    };
  }

  function makeCapeMesh(material, topWidth, bottomWidth, length, trimColor) {
    const cols = 7;
    const rows = 10;
    const geo = new THREE.BufferGeometry();
    const positions = [];
    const uvs = [];
    const colors = [];
    const indices = [];
    const trim = new THREE.Color(trimColor || 0xffdba6);
    for (let r = 0; r <= rows; r++) {
      const t = r / rows;
      const width = lerp(topWidth, bottomWidth, t);
      const trimMix = smoothstep(.84, 1.0, t);
      for (let c = 0; c <= cols; c++) {
        const u = c / cols;
        positions.push((u - .5) * width, -t * length, 0);
        uvs.push(u, t);
        colors.push(
          lerp(1, trim.r, trimMix),
          lerp(1, trim.g, trimMix),
          lerp(1, trim.b, trimMix)
        );
      }
    }
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const a = r * (cols + 1) + c;
        const b = a + 1;
        const cc = a + cols + 1;
        const d = cc + 1;
        indices.push(a, cc, b, b, cc, d);
      }
    }
    geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
    geo.setAttribute('uv', new THREE.Float32BufferAttribute(uvs, 2));
    geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
    geo.setIndex(indices);
    geo.computeVertexNormals();
    const mesh = new THREE.Mesh(geo, material);
    mesh.userData.rows = rows;
    mesh.userData.cols = cols;
    mesh.userData.topWidth = topWidth;
    mesh.userData.bottomWidth = bottomWidth;
    mesh.userData.length = length;
    mesh.frustumCulled = false;
    return mesh;
  }

  function createChild(opts) {
    const isPlayer = !!opts.isPlayer;
    const mats = makeChildMaterials(opts.accent, opts.glow, isPlayer);

    return {

      air: 0, walkPhase: rand() * TAU, facing: 0, bank: 0,

  }

  const player = createChild({ isPlayer: true, accent: '#f0c6a0', glow: '#ffd7a2' });
  const spawn = new THREE.Vector3(0, terrainHeight(0, 9.0) + 0.015, 9.0);
  player.root.position.copy(spawn);
  player.facing = 0;
  player.root.rotation.y = 0;
