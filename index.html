  let playerGround = terrainHeight(spawn.x, spawn.z);

  const companion = createChild({ accent: '#a8c8c6', glow: '#bfe7e0', wisp: true });
  const companionSpawn = new THREE.Vector3(3.9, terrainHeight(3.9, 3.2) + 0.015, 3.2);
  companion.root.position.copy(companionSpawn);
  companion.facing = -0.7;
  companion.root.rotation.y = companion.facing;
  companion.root.scale.setScalar(0.84);
  let companionGround = terrainHeight(companionSpawn.x, companionSpawn.z);
  let companionActivated = false;
  let companionVX = 0;
  let companionVZ = 0;
  let companionVY = 0;
  let wispPhase = 0;

  /* ---------------------------------------------------------------------- */
  /*  trail                                                                 */
  /* ---------------------------------------------------------------------- */
  const TRAIL_MAX = 40;
  const trailPositionsF = new Float32Array(TRAIL_MAX * 2 * 3);
  const trailAlphaF = new Float32Array(TRAIL_MAX * 2);
  const trailUvF = new Float32Array(TRAIL_MAX * 2 * 2);
  const trailGeo = new THREE.BufferGeometry();
  trailGeo.setAttribute('position', new THREE.BufferAttribute(trailPositionsF, 3).setUsage(THREE.DynamicDrawUsage));
  trailGeo.setAttribute('aAlpha', new THREE.BufferAttribute(trailAlphaF, 1).setUsage(THREE.DynamicDrawUsage));
  trailGeo.setAttribute('uv', new THREE.BufferAttribute(trailUvF, 2).setUsage(THREE.DynamicDrawUsage));
  {
    const idx = [];
    for (let i = 0; i < TRAIL_MAX - 1; i++) {
      const a = i * 2;
      idx.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
    }
    trailGeo.setIndex(idx);
  }
  const trailMat = new THREE.ShaderMaterial({
    uniforms: {
      uColor: { value: new THREE.Color(0xffd9a4) },
      uOpacity: { value: 1 }
    },
    transparent: true,
    depthWrite: false,
    depthTest: true,
    blending: THREE.AdditiveBlending,
    side: THREE.DoubleSide,
    vertexShader: `
      attribute float aAlpha;
      varying float vAlpha;
      varying vec2 vUv;
      void main() {
        vAlpha = aAlpha;
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      uniform vec3 uColor;
      uniform float uOpacity;
      varying float vAlpha;
      varying vec2 vUv;
      void main() {
        float edge = sin(clamp(vUv.x, 0.0, 1.0) * 3.14159265);
        edge = edge * edge;
        float a = edge * vAlpha * uOpacity;
        if (a < 0.004) discard;
        gl_FragColor = vec4(uColor, a * 0.18);
      }
    `
  });
  const trail = new THREE.Mesh(trailGeo, trailMat);
  trail.frustumCulled = false;
  trail.renderOrder = 4;
  scene.add(trail);
  const trailPoints = [];
  let lastTrailTime = 0;
  let lastTrailPos = new THREE.Vector3().copy(spawn);

  /* ---------------------------------------------------------------------- */
  /*  light orbs & memories                                                 */
  /* ---------------------------------------------------------------------- */
  const orbs = [];
  const memories = [];
  function spawnLightOrb(candle) {
    candle.anchor.getWorldPosition(TMP);
    const start = TMP.clone();
    const control = start.clone().add(new THREE.Vector3(range(-.6, .6), range(1.2, 2.2), range(.4, 1.1)));
    const mat = new THREE.SpriteMaterial({
      map: texGlow, color: 0xffd39a, transparent: true, opacity: 0.95,
      depthWrite: false, depthTest: false, blending: THREE.AdditiveBlending, toneMapped: true
    });
    const sprite = new THREE.Sprite(mat);
    sprite.position.copy(start);
    sprite.scale.setScalar(0.36);
    sprite.renderOrder = 8;
    scene.add(sprite);
    orbs.push({ sprite, mat, start, control, t: 0, candle, alive: true, trailTimer: 0 });
  }

  function addMemory(candle) {
    const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
      map: texSpark, color: candle ? 0xffd49b : 0xffe8c6, transparent: true, opacity: 0.9,
      depthWrite: false, depthTest: false, blending: THREE.AdditiveBlending, toneMapped: true
    }));
    sprite.scale.setScalar(0.12);
    sprite.renderOrder = 9;
    scene.add(sprite);
    memories.push({
      sprite, angle: rand() * TAU, radius: range(0.36, 0.95),
      speed: range(0.35, 1.1) * (rand() > .5 ? 1 : -1),
      height: range(0.5, 1.35), phase: rand() * TAU, age: 0
    });
  }

  /* ---------------------------------------------------------------------- */
  /*  input                                                                 */
  /* ---------------------------------------------------------------------- */
  const keys = new Set();
  let spaceHeld = false;
  let touchX = 0;
  let touchY = 0;
  let touchRise = false;
  let dragging = false;
  let dragX = 0;
  let dragY = 0;
  let activePointer = null;
  let camYaw = 0.075;
  let camPitch = 0.055;
  let camDist = portraitAtStart ? 8.65 : 7.15;
  let camDistTarget = portraitAtStart ? 8.65 : 7.15;
  let introStart = performance.now();
  let introDone = false;
  const followTarget = new THREE.Vector3(player.root.position.x, player.root.position.y + 1.22, player.root.position.z);
  const camPosTarget = new THREE.Vector3();
  const desiredCam = new THREE.Vector3();

  function setKey(code, value) {
    if (value) keys.add(code); else keys.delete(code);
  }
  window.addEventListener('keydown', (e) => {
    if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
    if (e.code === 'Space') spaceHeld = true;
    setKey(e.code, true);
    if (!introDone) introDone = true;
  }, { passive: false });
  window.addEventListener('keyup', (e) => {
    if (e.code === 'Space') spaceHeld = false;
    setKey(e.code, false);
  });
  window.addEventListener('blur', () => {
    keys.clear();
    spaceHeld = false;
    touchX = 0;
    touchY = 0;
    touchRise = false;
  });

  canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  canvas.addEventListener('pointerdown', (e) => {
    // 左键、右键、触屏都可以开始环顾
    if (e.pointerType === 'mouse' && e.button !== 0 && e.button !== 2) return;
    dragging = true;
    activePointer = e.pointerId;
    dragX = e.clientX;
    dragY = e.clientY;
    canvas.classList.add('dragging');
    try { canvas.setPointerCapture(e.pointerId); } catch (_) {}
    if (!introDone) introDone = true;
    e.preventDefault();
  });
  function onLookMove(e) {
    if (!dragging || e.pointerId !== activePointer) return;
    const dx = e.clientX - dragX;
    const dy = e.clientY - dragY;
    dragX = e.clientX;
    dragY = e.clientY;
    camYaw += dx * 0.0042;
    camPitch = clamp(camPitch + dy * 0.0033, 0.035, 0.86);
  }
  function endDrag(e) {
    if (e.pointerId !== activePointer) return;
    dragging = false;
    activePointer = null;
    canvas.classList.remove('dragging');
  }
  window.addEventListener('pointermove', onLookMove);
  window.addEventListener('pointerup', endDrag);
  window.addEventListener('pointercancel', endDrag);
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    camDistTarget = clamp(camDistTarget + e.deltaY * 0.006, 4.5, 14.5);
  }, { passive: false });

  // touch controls
  const stick = $('#stick');
  const knob = $('#stick-knob');
  const riseBtn = $('#rise');
  let stickPointer = null;
  function updateStick(e) {
    const rect = stick.getBoundingClientRect();
    const cx = rect.left + rect.width / 2;
    const cy = rect.top + rect.height / 2;
    let dx = (e.clientX - cx) / (rect.width * 0.36);
    let dy = (e.clientY - cy) / (rect.height * 0.36);
    const len = Math.hypot(dx, dy);
    if (len > 1) {
      dx /= len;
      dy /= len;
    }
    touchX = dx;
    touchY = -dy;
    knob.style.transform = `translate(${dx * 26}px, ${dy * 26}px)`;
  }
  if (stick) {
    stick.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      e.stopPropagation();
      stickPointer = e.pointerId;
      stick.setPointerCapture(e.pointerId);
      updateStick(e);
    });
    stick.addEventListener('pointermove', (e) => {
      if (e.pointerId !== stickPointer) return;
      e.preventDefault();
      updateStick(e);
    });
    const releaseStick = (e) => {
      if (e.pointerId !== stickPointer) return;
      stickPointer = null;
      touchX = 0;
      touchY = 0;
      knob.style.transform = 'translate(0px, 0px)';
    };
    stick.addEventListener('pointerup', releaseStick);
    stick.addEventListener('pointercancel', releaseStick);
  }
  if (riseBtn) {
    riseBtn.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      e.stopPropagation();
      touchRise = true;
      riseBtn.setPointerCapture(e.pointerId);
    });
    const releaseRise = (e) => {
      e.preventDefault();
      touchRise = false;
    };
    riseBtn.addEventListener('pointerup', releaseRise);
    riseBtn.addEventListener('pointercancel', releaseRise);
    riseBtn.addEventListener('pointerleave', releaseRise);
  }

  /* ---------------------------------------------------------------------- */
  /*  state & movement                                                      */
  /* ---------------------------------------------------------------------- */
  const state = {
    horizontalSpeed: 0,
    verticalSpeed: 0,
    grounded: true,
    altitude: 0,
    activated: false,
    flyingOnce: false,
    firstCandleDone: false,
    auraFlash: 0,
    elapsed: 0
  };
  let cloudImmersion = 0;
  let holdStart = 0;
  let lastWhisperTimer = null;

  function whisper(text, duration = 5200) {
    if (!whisperEl) return;
    whisperEl.textContent = text;
    whisperEl.classList.add('show');
    clearTimeout(lastWhisperTimer);
    lastWhisperTimer = setTimeout(() => whisperEl.classList.remove('show'), duration);
  }

  function movePlayer(dt) {
    let f = 0;
    let r = 0;
    if (keys.has('KeyW') || keys.has('ArrowUp')) f += 1;
    if (keys.has('KeyS') || keys.has('ArrowDown')) f -= 1;
    if (keys.has('KeyD') || keys.has('ArrowRight')) r += 1;
    if (keys.has('KeyA') || keys.has('ArrowLeft')) r -= 1;
    f += touchY;
    r += touchX;
    const mag = Math.hypot(f, r);
    if (mag > 1) {
      f /= mag;
      r /= mag;
    }
    const airborne = !state.grounded;
    const canFly = airborne ? 1 : 0;
    const speedTarget = airborne ? 6.7 : 3.45;
    const fwdX = -Math.sin(camYaw);
    const fwdZ = -Math.cos(camYaw);
    const rightX = Math.cos(camYaw);
    const rightZ = -Math.sin(camYaw);
    let dx = fwdX * f + rightX * r;
    let dz = fwdZ * f + rightZ * r;
    const inputLen = Math.hypot(dx, dz);
    const targetSpeed = speedTarget * Math.min(1, inputLen);
    if (inputLen > 0.001) {
      dx /= inputLen;
      dz /= inputLen;
    }

    const targetVX = dx * targetSpeed;
    const targetVZ = dz * targetSpeed;
    const accel = state.grounded ? 11 : 5.2;
    player.vx = damp(player.vx || 0, targetVX, accel, dt);
    player.vz = damp(player.vz || 0, targetVZ, accel, dt);
    const oldX = player.root.position.x;
    const oldZ = player.root.position.z;
    player.root.position.x += player.vx * dt;
    player.root.position.z += player.vz * dt;

    const horizontalSpeed = Math.hypot(player.vx, player.vz);
    state.horizontalSpeed = horizontalSpeed;
    const moving = horizontalSpeed > 0.25;
    if (moving) {
      const targetYaw = Math.atan2(-player.vx, -player.vz);
      const prevFacing = player.facing;
      player.facing = dampAngle(player.facing, targetYaw, airborne ? 5.0 : 9.5, dt);
      const turn = ((player.facing - prevFacing + Math.PI) % TAU + TAU) % TAU - Math.PI;
      player.bank = damp(player.bank, clamp(turn * 2.4, -0.45, 0.45) * clamp(horizontalSpeed / 4, 0, 1), 5, dt);
    } else {
      player.bank = damp(player.bank, 0, 4, dt);
    }
    player.root.rotation.y = player.facing;

    // 软边界：在草地上被风轻轻托回
    const radius = Math.hypot(player.root.position.x, player.root.position.z);
    const BOUND = 41.0;
    if (radius > BOUND - 4.5) {
      const inward = smoothstep(BOUND - 4.5, BOUND, radius);
      player.vx *= 1 - inward * 0.72;
      player.vz *= 1 - inward * 0.72;
      if (radius > BOUND) {
        const nx = player.root.position.x / radius;
        const nz = player.root.position.z / radius;
        player.root.position.x = nx * BOUND;
        player.root.position.z = nz * BOUND;
        const outward = player.vx * nx + player.vz * nz;
        if (outward > 0) {
          player.vx -= nx * outward;
          player.vz -= nz * outward;
        }
      }
    }

    playerGround = terrainHeight(player.root.position.x, player.root.position.z);
    const altitude = player.root.position.y - playerGround;
    state.altitude = Math.max(altitude, 0);

    if (state.grounded) {
      if (spaceHeld || touchRise) {
        state.grounded = false;
        state.verticalSpeed = 2.5;
        player.root.position.y = playerGround + 0.06;
        state.flyingOnce = true;
      } else {
        player.root.position.y = playerGround;
        state.verticalSpeed = 0;
      }
    }

    if (!state.grounded) {
      const alt = player.root.position.y - playerGround;
      const rising = spaceHeld || touchRise;
      if (rising) {
        const lift = 11.0 * (1 - smoothstep(25, 31, alt));
        state.verticalSpeed += lift * dt;
        state.verticalSpeed = Math.min(state.verticalSpeed, 4.25);
      } else {
        state.verticalSpeed = damp(state.verticalSpeed, -1.32, 2.1, dt);
      }
      player.root.position.y += state.verticalSpeed * dt;

      const floor = terrainHeight(player.root.position.x, player.root.position.z);
      if (player.root.position.y <= floor) {
        player.root.position.y = floor;
        state.verticalSpeed = 0;
        state.grounded = true;
      }
      // 非常柔软的天顶，不会碰壁
      const altNow = player.root.position.y - floor;
      if (altNow > 32) {
        player.root.position.y = floor + 32;
        if (state.verticalSpeed > 0) state.verticalSpeed *= 0.4;
      }
    }

    playerGround = terrainHeight(player.root.position.x, player.root.position.z);
    player.root.position.y = Math.max(player.root.position.y, playerGround);

    // 朝向运动方向时的轻微腾空感
    const groundNow = playerGround;
    const airTarget = state.grounded ? 0 : 1;
    player.air = damp(player.air, airTarget, 4.5, dt);
    animateChild(player, dt, horizontalSpeed, player.air, state.elapsed, true);

    // 插值相机目标
    followTarget.x = damp(followTarget.x, player.root.position.x, 8.5, dt);
    followTarget.z = damp(followTarget.z, player.root.position.z, 8.5, dt);
    const targetY = player.root.position.y + 1.22;
    followTarget.y = damp(followTarget.y, targetY, 9.5, dt);
  }

  function animateChild(c, dt, speed, air, time, isPlayer) {
    c.speed = speed;
    const move = clamp(speed / 3.2, 0, 1);
    c.walkPhase += dt * (2.6 + move * 7.5 + air * 1.8);
    const swing = Math.sin(c.walkPhase);
    const idle = Math.sin(time * 1.3 + (isPlayer ? 0 : 1.7));
    const breathe = Math.sin(time * 1.8 + (isPlayer ? 0 : 2.2));

    const groundBlend = 1 - air;
    c.legL.rotation.x = swing * 0.6 * move * groundBlend + air * (-0.5);
    c.legR.rotation.x = -swing * 0.6 * move * groundBlend + air * (-0.36);
    c.legL.rotation.z = 0.02 + air * 0.06;
    c.legR.rotation.z = -0.02 - air * 0.06;
    c.armL.rotation.x = -swing * 0.48 * move * groundBlend + air * (-1.16) + idle * 0.025;
    c.armR.rotation.x = swing * 0.48 * move * groundBlend + air * (-1.08) - idle * 0.025;
    c.armL.rotation.z = 0.12 + air * 0.4 + breathe * 0.012;
    c.armR.rotation.z = -0.12 - air * 0.4 - breathe * 0.012;

    c.visual.position.y = Math.abs(Math.sin(c.walkPhase)) * 0.033 * move * groundBlend + breathe * 0.006 + air * idle * 0.012;
    c.visual.rotation.x = damp(c.visual.rotation.x, -0.34 * air * clamp(speed / 5.2, .3, 1.15), 3.2, dt);
    c.visual.rotation.z = damp(c.visual.rotation.z, c.bank * .35, 4, dt);
    c.head.rotation.y = damp(c.head.rotation.y, idle * 0.17 * (1 - move * .7) + (isPlayer ? 0 : Math.sin(time * .5) * .2), 2, dt);
    c.head.rotation.x = damp(c.head.rotation.x, air * 0.06 + (isPlayer ? 0 : 0.02), 2, dt);

    const capePos = c.cape.geometry.attributes.position;
    const cols = c.cape.userData.cols;
    const rows = c.cape.userData.rows;
    const len = c.cape.userData.length;
    const topW = c.cape.userData.topWidth;
    const botW = c.cape.userData.bottomWidth;
    for (let r = 0; r <= rows; r++) {
      const t = r / rows;
      for (let cc = 0; cc <= cols; cc++) {
        const u = cc / cols;
        const idx = r * (cols + 1) + cc;
        const width = lerp(topW, botW, t) * (1 + air * .08);
        const wave = Math.sin(t * 5.2 - time * (2.0 + speed * .55) + u * 3.6) * 0.032 * t * (0.35 + air * .9);
        const flare = t * t * (air * (0.32 + speed * .022));
        capePos.setXYZ(idx, (u - .5) * width, -t * len + air * t * t * .12, 0.03 + t * .1 + flare + wave);
      }
    }
    capePos.needsUpdate = true;
    c.cape.geometry.computeVertexNormals();
    c.capePivot.rotation.x = damp(c.capePivot.rotation.x, -air * (0.16 + speed * 0.012), 3, dt);
    c.capePivot.rotation.z = damp(c.capePivot.rotation.z, -c.bank * .15, 4, dt);

    if (c.scarf) {
      const sp = c.scarf.geometry.attributes.position;
      for (let r = 0; r <= rows; r++) {
        const t = r / rows;
        for (let cc = 0; cc <= cols; cc++) {
          const u = cc / cols;
          const idx = r * (cols + 1) + cc;
          const width = 0.14 + t * 0.08;
          const wave = Math.sin(t * 4.6 - time * (2.6 + speed * .7) + u * 2.6 + 1.2) * 0.07 * t * (0.35 + air * 1.2);
          const flare = t * t * (air * (0.3 + speed * .025));
          sp.setXYZ(idx, (u - .5) * width, -t * 1.06 + air * t * t * .18, 0.04 + t * .16 + flare + wave);
        }
      }
      sp.needsUpdate = true;
      c.scarf.geometry.computeVertexNormals();
      c.scarfPivot.rotation.x = damp(c.scarfPivot.rotation.x, -air * (0.22 + speed * 0.018), 3, dt);
      c.scarfPivot.rotation.z = damp(c.scarfPivot.rotation.z, 0.1 - c.bank * .2 + Math.sin(time * 1.4) * 0.025, 4, dt);
    }
    const alt = c.isPlayer ? state.altitude : Math.max(0, c.root.position.y - terrainHeight(c.root.position.x, c.root.position.z));
    const lit = clamp(alt / 28, 0, 1);
    if (c.clasp) {
      c.clasp.material.opacity = 0.4 + lit * 0.22 + Math.sin(time * 2.1 + (isPlayer ? 0 : 1.4)) * 0.06;
    }
    const pulse = 0.9 + Math.sin(time * 2.0 + (isPlayer ? 0 : 1.2)) * 0.1;
    const auraOpacity = (isPlayer ? 0.19 : 0.14) + lit * 0.19 + (isPlayer ? state.auraFlash * 0.24 : 0);
    c.aura.material.opacity = auraOpacity * pulse;
    c.aura.scale.setScalar((isPlayer ? 2.45 : 2.0) + lit * .68 + (isPlayer ? state.auraFlash * .35 : 0));
    c.auraCore.material.opacity = 0.3 + lit * 0.3;
    c.auraCore.scale.setScalar(0.7 + lit * 0.18);
    c.point.intensity = (isPlayer ? .9 : .4) + lit * (isPlayer ? 2.0 : 1.0) + (isPlayer ? state.auraFlash * 1.8 : 0);
    c.point.color.setHex(0xffeeda);
    c.mats.white.emissiveIntensity = 0.035 + lit * 0.018;
    c.groundRing.material.opacity = (0.2 + lit * 0.2) * (0.9 + Math.sin(time * 1.8) * .08);
    c.groundRing.visible = alt < 1.2;
    c.blob.material.opacity = (isPlayer ? 0.235 : 0.16) * (1 - clamp(alt / 8, 0, .85));
    const bs = clamp(1.7 + alt * 0.16, 1.4, 3.8);
    c.blob.scale.setScalar(bs);
    // blob 贴着地形
    c.blob.position.set(c.root.position.x, terrainHeight(c.root.position.x, c.root.position.z) + 0.025, c.root.position.z);
    c.blob.visible = alt < 13;
  }

  /* ---------------------------------------------------------------------- */
  /*  companion                                                             */
  /* ---------------------------------------------------------------------- */
  function updateCompanion(dt) {
    const p = player.root.position;
    const distXZ = Math.hypot(p.x - companion.root.position.x, p.z - companion.root.position.z);
    if (!companionActivated) {
      companion.grounded = true;
      companion.root.position.y = terrainHeight(companion.root.position.x, companion.root.position.z);
      const lookAngle = Math.atan2(-(p.x - companion.root.position.x), -(p.z - companion.root.position.z));
      companion.facing = dampAngle(companion.facing, lookAngle + Math.sin(state.elapsed * .2) * .35, 1.2, dt);
      companion.root.rotation.y = companion.facing;
      companion.air = damp(companion.air, 0, 3, dt);
      companion.visual.position.y = Math.sin(state.elapsed * 1.5) * 0.008;
      if (distXZ < 5.0) {
        companionActivated = true;
        state.activated = true;
        companion.lightPulse = 1;
        whisper('有人，与你同行。', 5200);
        spawnCompanionRing();
      }
    } else {
      const fwdX = -Math.sin(player.facing);
      const fwdZ = -Math.cos(player.facing);
      const rightX = Math.cos(player.facing);
      const rightZ = -Math.sin(player.facing);
      const desiredX = p.x + fwdX * 0.55 + rightX * 1.8;
      const desiredZ = p.z + fwdZ * 0.55 + rightZ * 1.8;
      const dx = desiredX - companion.root.position.x;
      const dz = desiredZ - companion.root.position.z;
      const dist = Math.hypot(dx, dz);
      const followSpeed = clamp(1.7 + dist * 1.8, 1.7, 8.4);
      const targetVX = dist > .25 ? (dx / Math.max(dist, .001)) * followSpeed : 0;
      const targetVZ = dist > .25 ? (dz / Math.max(dist, .001)) * followSpeed : 0;
      companionVX = damp(companionVX, targetVX, 3.4, dt);
      companionVZ = damp(companionVZ, targetVZ, 3.4, dt);
      companion.root.position.x += companionVX * dt;
      companion.root.position.z += companionVZ * dt;
      const cRadius = Math.hypot(companion.root.position.x, companion.root.position.z);
      if (cRadius > 41.5) {
        companion.root.position.x = companion.root.position.x / cRadius * 41.5;
        companion.root.position.z = companion.root.position.z / cRadius * 41.5;
      }

      const cGround = terrainHeight(companion.root.position.x, companion.root.position.z);
      const playerAlt = player.root.position.y - terrainHeight(p.x, p.z);
      const wantFly = playerAlt > 1.7 || Math.hypot(companionVX, companionVZ) > 5.0;
      const targetY = wantFly ? Math.max(cGround + .2, p.y - .75 + Math.sin(state.elapsed * .8) * .2) : cGround;
      companionVY = damp(companionVY, (targetY - companion.root.position.y) * 2.4, 2.6, dt);
      companion.root.position.y += companionVY * dt;
      if (companion.root.position.y < cGround) {
        companion.root.position.y = cGround;
        companionVY = 0;
      }
      const horizontalSpeed = Math.hypot(companionVX, companionVZ);
      const facingTarget = Math.atan2(-companionVX, -companionVZ);
      if (horizontalSpeed > .4) {
        const prev = companion.facing;
        companion.facing = dampAngle(companion.facing, facingTarget, 4.5, dt);
        const turn = ((companion.facing - prev + Math.PI) % TAU + TAU) % TAU - Math.PI;
        companion.bank = damp(companion.bank, clamp(turn * 2, -0.4, .4), 5, dt);
      } else {
        companion.bank = damp(companion.bank, 0, 3, dt);
      }
      companion.root.rotation.y = companion.facing;
      const above = companion.root.position.y - cGround;
      companion.air = damp(companion.air, above > .25 ? 1 : 0, 3.5, dt);
      companion.visual.position.y = Math.sin(state.elapsed * 1.9) * 0.008;
      animateChild(companion, dt, Math.max(horizontalSpeed, .4), companion.air, state.elapsed, false);
      if (above > .25) {
        companion.blob.material.opacity = 0.1 * (1 - clamp(above / 8, 0, .8));
      }
    }

    if (companion.wisp) {
      wispPhase += dt * .8;
      companion.wisp.position.set(
        companion.root.position.x + Math.cos(wispPhase) * .55,
        companion.root.position.y + 1.45 + Math.sin(wispPhase * 1.7) * .12,
        companion.root.position.z + Math.sin(wispPhase) * .55
      );
      companion.wisp.material.opacity = .44 + Math.sin(wispPhase * 2.4) * .12;
    }
    companionGround = terrainHeight(companion.root.position.x, companion.root.position.z);
    companion.blob.position.set(companion.root.position.x, companionGround + .025, companion.root.position.z);
  }

  let companionRing = null;
  function spawnCompanionRing() {
    const mat = new THREE.MeshBasicMaterial({
      map: texRing, color: 0xbfe8e0, transparent: true, opacity: .8,
      depthWrite: false, blending: THREE.AdditiveBlending, toneMapped: true
    });
    const ring = new THREE.Mesh(new THREE.PlaneGeometry(1, 1), mat);
    ring.rotation.x = -Math.PI / 2;
    ring.position.copy(companion.root.position);
    ring.position.y += 0.06;
    ring.scale.setScalar(1.2);
    ring.renderOrder = 3;
    scene.add(ring);
    companionRing = { mesh: ring, life: 0 };
  }

  /* ---------------------------------------------------------------------- */
  /*  candle interactions                                                   */
  /* ---------------------------------------------------------------------- */
  function igniteCandle(candle) {
    if (candle.lit) return;
    candle.lit = true;
    candle.targetGlow = 1;
    spawnLightOrb(candle);
    if (!state.firstCandleDone) state.firstCandleDone = true;
  }

  function updateCandles(dt, time) {
    for (const c of candles) {
      c.glow = damp(c.glow, c.targetGlow, 2.0, dt);
      if (!c.lit && state.elapsed > 1.2) {
        const dx = player.root.position.x - c.root.position.x;
        const dz = player.root.position.z - c.root.position.z;
        const dy = player.root.position.y - c.root.position.y;
        if (Math.hypot(dx, dz) < 4.2 && dy > -1.2 && dy < 3.4) igniteCandle(c);
      }
      const g = c.glow;
      for (let i = 0; i < c.flames.length; i++) {
        const f = c.flames[i];
        const flick = 0.92 + Math.sin(time * 9.0 + f.phase) * .07 + Math.sin(time * 17.0 + f.phase * 2.1) * .035;
        const grow = smoothstep(0, 1, g);
        const s = Math.max(0.001, grow * flick);
        f.group.scale.set(s, s * (0.92 + Math.sin(time * 6 + f.phase) * .07), s);
        f.group.position.y = f.baseY + (flick - .95) * .05;
        f.group.rotation.y = Math.sin(time * 4 + f.phase) * .35;
      }
      c.halo.material.opacity = g * (0.18 + Math.sin(time * 2.4 + c.flare) * .025);
      c.halo.scale.setScalar(0.95 + g * .55 + Math.sin(time * 1.8 + c.flare) * .04);
      c.groundGlow.material.opacity = g * (0.32 + Math.sin(time * 1.6 + c.flare) * .03);
      c.groundGlow.scale.setScalar(3.3 + g * .9);
      c.light.intensity = g * (7.8 + Math.sin(time * 7.3 + c.flare) * .8 + Math.sin(time * 13.1 + c.flare * 2) * .35);
      c.light.position.y = 1.28;
      if (c.guide) {
        const near = smoothstep(13, 3.5, Math.hypot(player.root.position.x - c.root.position.x, player.root.position.z - c.root.position.z));
        c.guide.material.opacity = (1 - g) * (0.05 + near * .32) * (0.9 + Math.sin(time * 2.3 + c.flare) * .1);
        c.guide.position.y = 1.72 + Math.sin(time * 1.4 + c.flare) * .06;
      }
    }
  }

  function updateOrbs(dt) {
    for (let i = orbs.length - 1; i >= 0; i--) {
      const orb = orbs[i];
      orb.t += dt / 1.55;
      const t = clamp(orb.t, 0, 1);
      const e = t * t * (3 - 2 * t);
      const target = TMP.set(player.root.position.x, player.root.position.y + 0.95, player.root.position.z);
      const control = orb.control;
      const it = 1 - e;
      orb.sprite.position.set(
        it * it * orb.start.x + 2 * it * e * control.x + e * e * target.x,
        it * it * orb.start.y + 2 * it * e * control.y + e * e * target.y,
        it * it * orb.start.z + 2 * it * e * control.z + e * e * target.z
      );
      const pulse = 0.85 + Math.sin(orb.t * 22) * .08;
      orb.sprite.scale.setScalar((0.36 + Math.sin(orb.t * Math.PI) * .16) * pulse);
      orb.mat.opacity = 0.9 * smoothstep(0, .12, t);
      if (t >= 1) {
        scene.remove(orb.sprite);
        orb.mat.dispose();
        orbs.splice(i, 1);
        addMemory(orb.candle);
        state.auraFlash = Math.max(state.auraFlash || 0, 1);
        player.auraFlash = 1;
      }
    }
    state.auraFlash = damp(state.auraFlash || 0, 0, 2.2, dt);

    for (let i = memories.length - 1; i >= 0; i--) {
      const m = memories[i];
      m.age += dt;
      m.angle += m.speed * dt;
      const px = player.root.position.x + Math.cos(m.angle) * m.radius;
      const pz = player.root.position.z + Math.sin(m.angle) * m.radius;
      const py = player.root.position.y + m.height + Math.sin(state.elapsed * 1.4 + m.phase) * .1;
      m.sprite.position.set(px, py, pz);
      m.sprite.material.opacity = .6 + Math.sin(state.elapsed * 2 + m.phase) * .18;
      m.sprite.scale.setScalar(.105 + Math.sin(state.elapsed * 1.7 + m.phase) * .015);
    }
  }

  function updateTrail(dt) {
    const p = player.root.position;
    const moveSpeed = Math.hypot(player.vx || 0, player.vz || 0, state.verticalSpeed * .4);
    const want = !state.grounded || moveSpeed > .4;
    const elapsedNow = state.elapsed;
    const moved = Math.hypot(p.x - lastTrailPos.x, p.y - lastTrailPos.y, p.z - lastTrailPos.z);
    if (want && moved > .035 && elapsedNow - lastTrailTime > .025) {
      const spawnPoint = new THREE.Vector3(
        p.x + Math.sin(player.facing) * 0.04,
        p.y + .72 + Math.sin(elapsedNow * 2.1) * .03,
        p.z + Math.cos(player.facing) * 0.04
      );
      trailPoints.push({ pos: spawnPoint, age: 0, width: state.grounded ? .14 : .34 });
      lastTrailPos.copy(p);
      lastTrailTime = elapsedNow;
      if (trailPoints.length > TRAIL_MAX) trailPoints.shift();
    }
    for (const pt of trailPoints) pt.age += dt;
    while (trailPoints.length && trailPoints[0].age > 1.2) trailPoints.shift();

    const n = trailPoints.length;
    trailMat.uniforms.uOpacity.value = clamp((moveSpeed / 5.0) * (state.grounded ? .38 : .85) + (state.grounded ? 0 : .08), 0, .9);
    if (n < 2) {
      trailGeo.setDrawRange(0, 0);
      return;
    }
    const camDir = TMP2.copy(camera.position);
    for (let i = 0; i < n; i++) {
      const pt = trailPoints[i];
      const prev = trailPoints[Math.max(0, i - 1)].pos;
      const next = trailPoints[Math.min(n - 1, i + 1)].pos;
      const tangent = TMP.copy(next).sub(prev).normalize();
      const view = TMP3.copy(pt.pos).sub(camDir).normalize();
      const side = new THREE.Vector3().crossVectors(tangent, view).normalize();
      const fade = clamp(1 - pt.age / 1.15, 0, 1);
      const width = pt.width * (0.4 + fade * .8) * (0.7 + (i / n) * .3);
      const idx = i * 2;
      trailPositionsF[idx * 3] = pt.pos.x - side.x * width;
      trailPositionsF[idx * 3 + 1] = pt.pos.y - side.y * width;
      trailPositionsF[idx * 3 + 2] = pt.pos.z - side.z * width;
      trailPositionsF[(idx + 1) * 3] = pt.pos.x + side.x * width;
      trailPositionsF[(idx + 1) * 3 + 1] = pt.pos.y + side.y * width;
      trailPositionsF[(idx + 1) * 3 + 2] = pt.pos.z + side.z * width;
      trailUvF[idx * 2] = 0;
      trailUvF[idx * 2 + 1] = i / (n - 1);
      trailUvF[(idx + 1) * 2] = 1;
      trailUvF[(idx + 1) * 2 + 1] = i / (n - 1);
      const alpha = fade * (0.32 + 0.68 * (i / n));
      trailAlphaF[idx] = alpha;
      trailAlphaF[idx + 1] = alpha;
    }
    trailGeo.attributes.position.needsUpdate = true;
    trailGeo.attributes.aAlpha.needsUpdate = true;
    trailGeo.attributes.uv.needsUpdate = true;
    trailGeo.setDrawRange(0, (n - 1) * 6);
  }

  /* ---------------------------------------------------------------------- */
  /*  camera                                                                */
  /* ---------------------------------------------------------------------- */
  function updateCamera(dt, time) {
    if (!introDone) {
      const introT = clamp((performance.now() - introStart) / 5000, 0, 1);
      if (introT >= 1) introDone = true;
    }
    const introEase = introDone ? 1 : smoothstep(0, 1, (performance.now() - introStart) / 5000);
    const introExtra = (1 - introEase) * 3.4;
    // 没有鼠标时，Q / E 也能环顾
    if (keys.has('KeyQ')) camYaw += dt * 1.8;
    if (keys.has('KeyE')) camYaw -= dt * 1.8;
    camDist = damp(camDist, camDistTarget, 5, dt);
    const dist = camDist + introExtra + player.air * 1.45;
    const cosP = Math.cos(camPitch);
    const sinP = Math.sin(camPitch);
    desiredCam.set(
      followTarget.x + Math.sin(camYaw) * dist * cosP,
      followTarget.y + sinP * dist,
      followTarget.z + Math.cos(camYaw) * dist * cosP
    );
    const floor = terrainHeight(desiredCam.x, desiredCam.z) + 1.1;
    if (desiredCam.y < floor) desiredCam.y = floor;
    const k = 1 - Math.exp(-7.5 * dt);
    camera.position.lerp(desiredCam, k);
    // 防止相机穿入地形
    const camFloor = terrainHeight(camera.position.x, camera.position.z) + .75;
    if (camera.position.y < camFloor) camera.position.y = camFloor;
    camera.lookAt(followTarget.x, followTarget.y - 0.02, followTarget.z);

    // 让太阳跟着相机，保持无限远
    sunGroup.position.copy(camera.position).addScaledVector(sunDir, 620);
    skyRig.position.copy(camera.position);
  }

  /* ---------------------------------------------------------------------- */
  /*  environment update                                                    */
  /* ---------------------------------------------------------------------- */
  let lastPhaseLabel = '';
  function updateEnvironment(dt) {
    cycle = (cycle + dt / CYCLE_SECONDS) % 1;
    readPalette(cycle);
    skyUniforms.uTime.value = state.elapsed;
    skyUniforms.uHorizon.value.copy(env.horizon);
    skyUniforms.uMid.value.copy(env.mid);
    skyUniforms.uUpper.value.copy(env.upper);
    skyUniforms.uZenith.value.copy(env.zenith);
    skyUniforms.uGlow.value.copy(env.glow);
    skyUniforms.uSun.value.copy(env.sun);
    skyUniforms.uCloud.value.copy(env.cloud);
    skyUniforms.uFog.value.copy(env.fog);
    skyUniforms.uSunDir.value.copy(sunDir);
    renderer.toneMappingExposure = env.exposure;

    sunDir.set(-0.34 * Math.cos(env.elevation), Math.sin(env.elevation), -0.92 * Math.cos(env.elevation)).normalize();
    sunLight.position.copy(sunDir).multiplyScalar(85);
    sunLight.color.copy(env.light);
    sunLight.intensity = 2.1;
    hemi.color.copy(env.hemiSky);
    hemi.groundColor.copy(env.hemiGround);
    fillLight.color.copy(env.upper);
    scene.fog.color.copy(env.fog);
    scene.fog.density = FOG_BASE * (1 + cloudImmersion * 6.5);
    if (cloudImmersion > .01) {
      scene.fog.color.lerp(env.cloud, cloudImmersion * .55);
    }

    sunHaloWide.material.color.copy(env.glow);
    sunHalo.material.color.copy(env.glow).lerp(env.sun, .35);
    sunCore.material.color.copy(env.sun);
    sunHaloWide.material.opacity = 0.24 + env.star * .12;
    sunHalo.material.opacity = 0.5;
    sunCore.material.opacity = 0.92;

    for (const layer of starLayers) {
      layer.mat.opacity = env.star * layer.baseOpacity * 1.4;
    }
    const cloudShadeColor = TMP_CLOUD.copy(env.cloud).lerp(env.upper, .42);
    for (const mat of cloudTintMats) {
      mat.color.copy(env.cloud).lerp(cloudShadeColor, (mat.userData.shade || 0) * .75);
      mat.color.lerp(env.sun, (mat.userData.warmth || 0) * .42 + .16);
      mat.color.multiplyScalar(1.045);
      if (mat.userData.cool) mat.color.lerp(env.mid, mat.userData.cool * .22);
      if (mat.userData.baseOpacity != null) {
        mat.opacity = mat.userData.baseOpacity * (0.9 + (mat.userData.warmth || 0) * 0.12);
      }
    }
    if (env.label !== lastPhaseLabel) {
      lastPhaseLabel = env.label;
      phaseText.textContent = env.label;
    }
    document.documentElement.style.setProperty('--glow', '#' + env.glow.clone().lerp(env.sun, .3).getHexString());

    sunHaloWide.scale.set(220, 95 + Math.sin(state.elapsed * .2) * 3, 1);
    sunRays.material.rotation = state.elapsed * .006;
    sunRays.material.opacity = .1 + Math.sin(state.elapsed * .17) * .02;
  }

  function updateClouds(dt, time) {
    cloudBank.rotation.y -= dt * 0.0009;
    flyCloudGroup.rotation.y += dt * 0.0007;
    const t = time;
    for (const p of seaClouds) {
      p.position.y = p.userData.baseY + Math.sin(t * .11 + p.userData.phase) * .7;
    }
    for (const p of flyClouds) {
      p.position.y += Math.sin(t * .25 + p.userData.phase) * .0008;
    }
    // 玩家和相机进入云体时，世界会短暂被柔光吞没
    let immersionTarget = 0;
    for (const cluster of cloudClusters) {
      const dp = player.root.position.distanceTo(cluster.center);
      const dc = camera.position.distanceTo(cluster.center);
      const p = 1 - smoothstep(cluster.radius * .35, cluster.radius * 1.22, dp);
      const c = 1 - smoothstep(cluster.radius * .25, cluster.radius * 1.05, dc);
      immersionTarget = Math.max(immersionTarget, p * .7, c * .42);
    }
    // 靠近指定高度层时，一点轻薄的遮挡
    const alt = player.root.position.y - terrainHeight(player.root.position.x, player.root.position.z);
    cloudImmersion = damp(cloudImmersion, clamp(immersionTarget, 0, 1), 2.4, dt);
    cloudVeil.style.opacity = String(cloudImmersion * .76);
  }

  function updateMotes(dt, time) {
    const pos = moteGeo.attributes.position.array;
    for (let i = 0; i < moteCount; i++) {
      const ph = motePhase[i];
      const amp = moteAmp[i];
      pos[i * 3] = moteBase[i * 3] + Math.sin(time * .23 + ph) * amp;
      pos[i * 3 + 1] = moteBase[i * 3 + 1] + Math.sin(time * .41 + ph * 2.4) * .33 * amp + Math.sin(time * .13 + ph) * .1;
      pos[i * 3 + 2] = moteBase[i * 3 + 2] + Math.cos(time * .19 + ph * 1.3) * amp;
    }
    moteGeo.attributes.position.needsUpdate = true;
    moteMat.opacity = .41 + Math.sin(time * .7) * .08;
    for (const f of tallFlowers) {
      f.group.rotation.z = Math.sin(time * f.speed + f.phase) * .05;
      f.head.material.rotation += 0.0009;
      f.head.material.opacity = .8 + Math.sin(time * 1.6 + f.phase) * .1;
    }
  }

  /* ---------------------------------------------------------------------- */
  /*  loop                                                                  */
  /* ---------------------------------------------------------------------- */
  let lastFrame = performance.now();
  let firstRender = true;
  let readyTime = 0;
  let eventStart = performance.now();

  function simulate(dt) {
    state.elapsed += dt;

    movePlayer(dt);
    updateCompanion(dt);
    updateCandles(dt, state.elapsed);
    updateOrbs(dt);
    updateTrail(dt);
    updateClouds(dt, state.elapsed);
    updateMotes(dt, state.elapsed);
    updateEnvironment(dt);
    updateCamera(dt, state.elapsed);
    grassTime.value = state.elapsed;
    const flyingNow = !state.grounded && state.altitude > .35;
    if (flyingNow !== state.wasFlying) {
      state.wasFlying = flyingNow;
      document.body.classList.toggle('is-flying', flyingNow);
    }

    if (companionRing) {
      companionRing.life += dt;
      const t = companionRing.life / 1.9;
      companionRing.mesh.scale.setScalar(1.1 + t * 4.2);
      companionRing.mesh.material.opacity = (1 - t) * .65;
      if (t >= 1) {
        scene.remove(companionRing.mesh);
        companionRing.mesh.material.dispose();
        companionRing.mesh.geometry.dispose();
        companionRing = null;
      }
    }
  }

  function frame(now) {
    const dt = Math.min(0.05, Math.max(0.001, (now - lastFrame) / 1000));
    lastFrame = now;
    simulate(dt);
    renderFrame();

    if (firstRender) {
      firstRender = false;
      readyTime = now;
      setTimeout(() => {
        document.body.classList.add('is-ready');
        loadingEl.classList.add('done');
        setTimeout(() => whisper('靠近烛火，光会记得你。', 9500), 1600);
      }, 220);
    }

    requestAnimationFrame(frame);
  }

  // 调试 / 截图辅助（不影响画面）
  window.__shimmer = {
    scene, camera, renderer, player, companion, candles, env,
    get state() { return state; },
    teleport(x, z, y) {
      player.root.position.set(x, y == null ? terrainHeight(x, z) : y, z);
      followTarget.set(x, player.root.position.y + 1.15, z);
    },
    setCycle(v) { cycle = v; },
    igniteAll() { candles.forEach((c) => igniteCandle(c)); },
    advance(seconds, steps = 90) {
      const n = Math.max(1, steps | 0);
      const dt = seconds / n;
      for (let i = 0; i < n; i++) simulate(dt);
      renderFrame();
    },
    renderNow() { renderFrame(); },
    get atmosphere() { return { cycle, cloudImmersion }; }
  };

  // resize
  window.addEventListener('resize', () => {
    const w = window.innerWidth;
    const h = window.innerHeight;
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, maxDpr));
    renderer.setSize(w, h);
    resizeRenderTargets();
    camera.aspect = w / h;
    camera.fov = (h > w * 1.15) ? 64 : 56;
    camera.updateProjectionMatrix();
  });

  renderer.domElement.addEventListener('webglcontextlost', (e) => {
    e.preventDefault();
    fatal('浏览器暂时失去了 WebGL 上下文。<br>请刷新页面，让光重新聚拢。');
  });

  requestAnimationFrame((t) => {
    lastFrame = t;
    introStart = performance.now();
    requestAnimationFrame(frame);
  });
}

boot();
</script>
</body>
</html>
